plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

repositories {
    mavenCentral()
}

// Les tests en jeu (captures d'écran) vivent dans leur propre source set :
// ils ne finissent jamais dans le jar livré.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "abstickmen-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    // Pas de bloc `mappings` : depuis la 26.1 le jar de Minecraft porte déjà les noms officiels.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    gametestImplementation "net.fabricmc.fabric-api:fabric-client-gametest-api-v1:${project.client_gametest_version}"
}

loom.runs.matching { it.name == "clientGameTest" }.configureEach {
    runDir = "run/gametest"
    if (project.hasProperty("scenes")) vmArg "-Dabstickmen.test.scenes=${project.property('scenes')}"
}

// Après chaque build, le jar part tout seul dans les instances de jeu (il écrase le précédent).
// Si le jeu de l'instance est ouvert, Windows refuse de renommer le jar qu'il utilise : on n'y touche
// pas (le remplacer en pleine partie pourrait la faire planter).
def instances = ["Test mods Fabric 26.3", "Skyblock 26.3"].collect {
    file("${System.getProperty('user.home')}/curseforge/minecraft/Instances/${it}/mods")
}
tasks.register("installMod") {
    dependsOn tasks.named("jar")
    def jar = tasks.named("jar").flatMap { it.archiveFile }
    doLast {
        def source = jar.get().asFile
        instances.findAll { it.isDirectory() }.each { mods ->
            def cible = new File(mods, source.name)
            def essai = new File(mods, source.name + ".essai")
            if (cible.exists()) {
                boolean libre = cible.renameTo(essai)
                if (essai.exists() && !cible.exists()) {
                    essai.renameTo(cible)
                }
                if (!libre) {
                    println "Jeu ouvert sur « ${mods.parentFile.name} » : jar pas remplacé (relance le build une fois le jeu fermé)"
                    return
                }
            }
            copy {
                from source
                into mods
            }
            println "Mod installé dans ${mods}"
        }
    }
}
tasks.named("build") { finalizedBy "installMod" }

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
